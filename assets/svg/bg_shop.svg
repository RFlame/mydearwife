<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE0BC"/>
      <stop offset="1" stop-color="#DFCB9E"/>
    </linearGradient>
    <style>
      .ol3 { stroke:#4A3525; stroke-width:3.5; stroke-linejoin:round; stroke-linecap:round; }
      .txt { font-family:'PingFang SC','Hiragino Sans GB',sans-serif; fill:#4A3525; font-weight:700; }
    </style>
  </defs>
  <rect width="720" height="1280" fill="url(#wall)"/>

  <!-- 木货架与商品（高处，部分被 HUD 遮挡） -->
  <rect x="-20" y="196" width="760" height="18" fill="#8F6B4A" class="ol3"/>
  <g class="ol3">
    <rect x="20" y="150" width="40" height="46" rx="4" fill="#C94F3D"/>
    <rect x="74" y="150" width="40" height="46" rx="4" fill="#3E5C8F"/>
    <rect x="128" y="150" width="40" height="46" rx="4" fill="#C8A06A"/>
    <rect x="560" y="150" width="40" height="46" rx="4" fill="#C8A06A"/>
    <rect x="614" y="150" width="40" height="46" rx="4" fill="#C94F3D"/>
    <rect x="668" y="150" width="40" height="46" rx="4" fill="#3E5C8F"/>
  </g>
  <!-- 红色店招横幅 -->
  <rect x="180" y="106" width="360" height="46" rx="6" fill="#C94F3D" class="ol3"/>
  <text x="360" y="139" text-anchor="middle" font-size="30" style="font-family:'PingFang SC',sans-serif;fill:#F5E6C8;font-weight:900;letter-spacing:8">零食叮叮咚</text>

  <!-- 两侧奖状挂历 -->
  <g transform="translate(18,222) rotate(-4)">
    <rect x="0" y="0" width="86" height="60" fill="#F5E6C8" class="ol3"/>
    <rect x="6" y="6" width="74" height="48" fill="none" stroke="#C94F3D" stroke-width="2"/>
    <text x="43" y="40" text-anchor="middle" font-size="24" class="txt" fill="#C94F3D">奖状</text>
  </g>
  <g transform="translate(618,218) rotate(3)">
    <rect x="0" y="0" width="76" height="66" fill="#F5E6C8" class="ol3"/>
    <rect x="0" y="0" width="76" height="18" fill="#C94F3D" class="ol3"/>
    <text x="38" y="54" text-anchor="middle" font-size="30" class="txt">17</text>
  </g>

  <!-- 绿漆墙裙（顾客身后） -->
  <rect x="0" y="292" width="720" height="40" fill="#7A9B76"/>
  <rect x="0" y="288" width="720" height="6" fill="#5E7D5B"/>

  <!-- 木收银台 -->
  <rect x="-20" y="330" width="760" height="230" fill="#B08954" class="ol3"/>
  <rect x="-20" y="330" width="760" height="24" fill="#8F6B4A" class="ol3"/>
  <g stroke="#8F6B4A" stroke-width="4" opacity="0.7">
    <path d="M0 420 h720 M0 480 h720"/>
  </g>

  <!-- 台下墙面绿墙裙底部（篮子后方，淡） -->
  <rect x="0" y="1046" width="720" height="14" fill="#7A9B76" opacity="0.5"/>
</svg>
