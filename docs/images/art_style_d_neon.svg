      <rect x="650" y="150" width="44" height="50" rx="8" fill="#6FA8FF"/>
      <rect x="30" y="212" width="44" height="46" rx="8" fill="#FFB35C"/>
      <rect x="90" y="212" width="44" height="46" rx="8" fill="#B18CFF"/>
      <rect x="560" y="212" width="44" height="46" rx="8" fill="#4DE8E0"/>
