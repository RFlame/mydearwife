<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#26221E; font-family:'PingFang SC',sans-serif; }
  h1 { color:#FFF6E8; font-size:30px; text-align:center; margin:0; padding:18px 0 6px; }
  p.sub { color:#B8AA96; font-size:16px; text-align:center; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:360px 360px; gap:16px; justify-content:center; padding:0 16px 16px; }
  .cell { background:#3A332C; border-radius:14px; overflow:hidden; }
  .cell img { width:360px; height:640px; display:block; }
  .label { color:#FFF6E8; font-size:20px; font-weight:700; text-align:center; padding:10px 4px; }
  .label small { display:block; color:#B8AA96; font-size:13px; font-weight:400; margin-top:3px; }
</style>
</head>
<body>
<h1>零食叮叮咚 · 美术风格四选一</h1>
<p class="sub">同一游戏画面布局，四种风格方向（示意图，非最终美术品质）</p>
<div class="grid">
  <div class="cell"><img src="art_style_ref.png"><div class="label">A · 暖阳零食店（原方案）<small>高饱和暖色 · 热闹解压 · 粗描边 Q 版</small></div></div>
  <div class="cell"><img src="art_style_b_cream.png"><div class="label">B · 奶油清新 ins 风<small>低饱和 pastel · 温柔治愈 · 细描边</small></div></div>
  <div class="cell"><img src="art_style_c_retro.png"><div class="label">C · 复古国潮小卖部<small>80/90 怀旧 · 机械台秤 · 竹篮搪瓷盘</small></div></div>
  <div class="cell"><img src="art_style_d_neon.png"><div class="label">D · 深夜霓虹便利店<small>暗夜霓虹 · 潮酷发光 · 高对比</small></div></div>
</div>
</body>
</html>
