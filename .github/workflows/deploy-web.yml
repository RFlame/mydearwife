name: Deploy Godot Web to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-cos-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Export and publish Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: tencent-cos
      url: ${{ steps.verify.outputs.site_url }}
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python for COS SDK
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/export_templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/export_templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -q "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/export_templates"
          cp -a "$RUNNER_TEMP/export_templates/templates/." "$template_dir/"

      - name: Import Godot resources
        run: |
          "$RUNNER_TEMP/godot/godot" --headless --path . --import

      - name: Export Web release
        run: |
          mkdir -p build/web
          "$RUNNER_TEMP/godot/godot" --headless --path . --export-release "Web" build/web/index.html

      - name: Verify required Web files
        run: |
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Install Tencent COS SDK
        run: |
          python -m pip install --disable-pip-version-check cos-python-sdk-v5==1.9.45

      - name: Upload Web release to Tencent COS
        shell: bash
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          set -euo pipefail
          for name in TENCENT_SECRET_ID TENCENT_SECRET_KEY TENCENT_COS_BUCKET TENCENT_COS_REGION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions Secret: $name"
              exit 1
            fi
          done
          python tools/tencent_cos_deploy.py \
            --source build/web \
            --bucket "$TENCENT_COS_BUCKET" \
            --region "$TENCENT_COS_REGION"

      - name: Verify public Tencent COS deployment
        id: verify
        shell: bash
        env:
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
        run: |
          set -euo pipefail
          site_url="https://${TENCENT_COS_BUCKET}.cos-website.${TENCENT_COS_REGION}.myqcloud.com"
          for file in index.html index.js index.wasm index.pck; do
            curl --fail --silent --show-error --location --head \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 45 \
              "$site_url/$file" > /dev/null
          done
          echo "site_url=$site_url/" >> "$GITHUB_OUTPUT"
