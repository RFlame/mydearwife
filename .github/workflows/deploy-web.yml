name: Deploy Godot Web to EdgeOne Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Export and publish Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: edgeone-pages
      url: ${{ steps.publish.outputs.site_url }}
    env:
      GODOT_VERSION: "4.7.2"
      EDGEONE_PROJECT_NAME: "mydearwife"
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js for EdgeOne CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/export_templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/export_templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -q "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/export_templates"
          cp -a "$RUNNER_TEMP/export_templates/templates/." "$template_dir/"

      - name: Import Godot resources
        run: |
          "$RUNNER_TEMP/godot/godot" --headless --path . --import

      - name: Export Web release
        run: |
          mkdir -p build/web
          "$RUNNER_TEMP/godot/godot" --headless --path . --export-release "Web" build/web/index.html

      - name: Verify required Web files
        run: |
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Package Web release as ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("build/web")
          archive_path = Path(os.environ["RUNNER_TEMP"]) / "mydearwife-web.zip"
          with ZipFile(archive_path, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          with ZipFile(archive_path) as archive:
              if archive.testzip() is not None:
                  raise RuntimeError("Web ZIP integrity check failed")
              required = {"index.html", "index.js", "index.wasm", "index.pck"}
              if not required.issubset(archive.namelist()):
                  raise RuntimeError("Web ZIP is missing required root files")
          print("Web ZIP size: %s bytes" % archive_path.stat().st_size)
          PY

      - name: Deploy Web release to EdgeOne Pages
        id: publish
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$EDGEONE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions Secret: EDGEONE_API_TOKEN"
            exit 1
          fi
          deploy_log="$RUNNER_TEMP/edgeone-deploy.log"
          set +e
          npx --yes edgeone@1.7.3 makers deploy "$RUNNER_TEMP/mydearwife-web.zip" \
            --name "$EDGEONE_PROJECT_NAME" \
            --env production \
            --area global \
            --token "$EDGEONE_API_TOKEN" \
            --skip-ai-gateway-sync \
            --json 2>&1 | tee "$deploy_log"
          deploy_status=${PIPESTATUS[0]}
          set -e
          if [[ $deploy_status -ne 0 ]]; then
            python3 tools/edgeone_pages_result.py "$deploy_log" --diagnose --query-api
            exit "$deploy_status"
          fi
          python3 tools/edgeone_pages_result.py "$deploy_log" --github-output "$GITHUB_OUTPUT"

      - name: Verify public EdgeOne Pages deployment
        shell: bash
        env:
          EDGEONE_SITE_URL: ${{ steps.publish.outputs.site_url }}
        run: |
          set -euo pipefail
          if [[ -z "$EDGEONE_SITE_URL" ]]; then
            echo "::error::EdgeOne Pages deployment did not return a public URL"
            exit 1
          fi
          site_url="${EDGEONE_SITE_URL%/}"
          for file in index.html index.js index.wasm index.pck; do
            if ! curl --fail --silent --show-error --location --head \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 45 \
              "$site_url/$file" > /dev/null; then
              echo "::error::Public file check failed: $site_url/$file"
              exit 1
            fi
          done
          home_headers="$RUNNER_TEMP/edgeone-home-headers.txt"
          if ! curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 --max-time 45 \
            --dump-header "$home_headers" --output /dev/null "$site_url/"; then
            echo "::error::Public homepage GET failed: $site_url/"
            exit 1
          fi
          if ! grep -Eiq '^Content-Type:[[:space:]]*text/html' "$home_headers"; then
            echo "::error::Homepage is not served as text/html: $site_url/"
            exit 1
          fi
          if grep -Eiq '^Content-Disposition:[[:space:]]*attachment' "$home_headers"; then
            echo "::error::Homepage is served as an attachment instead of being displayed: $site_url/"
            exit 1
          fi
