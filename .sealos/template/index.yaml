apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: mydearwife
spec:
  title: 零食叮叮咚
  url: ''
  gitRepo: ''
  author: ''
  description: 复古国潮小卖部收银分拣游戏，Godot 4.7.2 Web 版。
  readme: ''
  icon: ''
  templateType: inline
  locale: en
  categories: []
  defaults:
    app_name:
      type: string
      value: mydearwife-${{ random(8) }}
    app_host:
      type: string
      value: web-${{ random(8) }}
  inputs: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-web
  annotations:
    originImageName: harbor.bja.sealos.run/ns-d3r52j3p/mydearwife/web:20261118-024156
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-web
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-web
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-web
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      imagePullSecrets:
      - name: harbor-registry-cred-hp-ns-d3r52j3p
      containers:
      - name: ${{ defaults.app_name }}-web
        image: harbor.bja.sealos.run/ns-d3r52j3p/mydearwife/web:20261118-024156
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 20m
            memory: 25Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - containerPort: 80
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-web
  labels:
    app: ${{ defaults.app_name }}-web
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-web
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-web
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-web
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
spec:
  rules:
  - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: ${{ defaults.app_name }}-web
            port:
              number: 80
  tls:
  - hosts:
    - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
    secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}-web
  labels:
    app: ${{ defaults.app_name }}-web
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-web
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: ''
  name: 零食叮叮咚
  type: link
